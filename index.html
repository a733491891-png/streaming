<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta name="description" content="الموقع الرسمي لمتابعة مباريات المنتخب العراقي وأسود الرافدين ببث مباشر وجودة عالية وبدون تقطيع.">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أسود الرافدين - بث مباشر</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #121212; color: #ffffff; font-family: sans-serif; }
        .navbar-custom { background-color: #007a3d; padding: 15px; text-align: center; border-bottom: 3px solid #000; }
        .brand-title { font-size: 24px; font-weight: bold; color: white; text-decoration: none; }
        #video-container { position: relative; width: 100%; max-width: 800px; margin: 20px auto; background-color: #000; padding: 10px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .match-card { background-color: #1e1e1e; color: #ffffff; border: 1px solid #2d2d2d; border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        .team-name { font-size: 20px; font-weight: bold; }
        .team-logo { width: 65px; height: 65px; object-fit: contain; border-radius: 5px; }
        .score { font-size: 26px; font-weight: bold; color: #ffcc00; }
        .status-badge { display: inline-block; padding: 4px 15px; border-radius: 20px; font-size: 13px; font-weight: bold; color: white; margin-top: 5px; background-color: #e63946; }
        .match-details { border-top: 1px solid #333; margin-top: 15px; padding-top: 10px; font-size: 14px; color: #b3b3b3; }
    </style>
</head>
<body>

    <nav class="navbar-custom">
        <a href="#" class="brand-title"><i class="fa-solid fa-trophy me-2 text-warning"></i> موقع بث مباريات المنتخب العراقي</a>
    </nav>

    <div class="container my-4">

        <div id="video-container">
            <div id="click-overlay" onclick="handleStreamClick()" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 999; cursor: pointer; background: rgba(0,0,0,0.01);"></div>

            <iframe id="match-player" src="https://jkndasijn.work.gd/embed.php?id=4005135022" 
                    width="100%" 
                    height="500px" 
                    frameborder="0" 
                    sandbox="allow-scripts allow-same-origin allow-forms" 
                    allowfullscreen>
            </iframe>
        </div>

        <h5 class="mb-3 text-success"><i class="fa-solid fa-circle-play me-2"></i> المباريات الجارية الآن:</h5>

        <div class="match-card">
            <div class="row align-items-center text-center">
                <div class="col-4 d-flex align-items-center justify-content-center gap-3">
                    <img src="https://flagcdn.com/w160/iq.png" class="team-logo" alt="العراق">
                    <span class="team-name">العراق</span>
                </div>
                
                <div class="col-4">
                    <div class="score">0 - 0</div>
                    <span class="status-badge">مباشر الآن</span>
                </div>
                
                <div class="col-4 d-flex align-items-center justify-content-center gap-3">
                    <span class="team-name">الفريق الخصم</span>
                    <img src="https://flagcdn.com/w160/un.png" class="team-logo">
                </div>
            </div>
            
            <div class="row match-details text-center">
                <div class="col-4"><i class="fa-solid fa-tv me-1 text-success"></i> القناة الناقلة</div>
                <div class="col-4"><i class="fa-solid fa-microphone me-1 text-success"></i> بث مباشر بجودة عالية</div>
                <div class="col-4"><i class="fa-solid fa-earth-asia me-1 text-success"></i> تصفيات كأس العالم</div>
            </div>
        </div>

    </div>

    <script>
        let clickCount = 0;
        
        // رابط خادم الإعلانات الذكي الخاص بك من Adsterra
        const realAdUrl = "https://www.effectivecpmnetwork.com/z30dnikhy?key=4b52923a1cbe17849d1e3fac705d8f27";

        function handleStreamClick() {
            clickCount++;

            if (clickCount <= 2) {
                // الضغطة الأولى والثانية: تفتح صفحة الإعلان الحقيقية في تبويب جديد
                window.open(realAdUrl, '_blank');
            } 
            else if (clickCount >= 3) {
                // الضغطة الثالثة: تفتح الإعلان الأخير وتزيل الغطاء الشفاف فوراً ليتفاعل المستخدم مع البث
                window.open(realAdUrl, '_blank');
                document.getElementById('click-overlay').style.display = 'none';
            }
        }
    </script>
</body>
</html>
